name: Tag release

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.100'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore dependencies
        run: dotnet restore Old8Lang.sln
      - name: Build solution
        run: dotnet build Old8Lang.sln --configuration Release --no-restore
      - name: Configure Python runtime for tests
        run: |
          PYDLL=$(python3 -c "import os, sys, sysconfig; assert sys.version_info < (3, 14); libdir = sysconfig.get_config_var('LIBDIR') or ''; multiarch = sysconfig.get_config_var('MULTIARCH') or ''; names = [sysconfig.get_config_var('INSTSONAME'), sysconfig.get_config_var('LDLIBRARY'), f'libpython{sys.version_info.major}.{sys.version_info.minor}.so.1.0', f'libpython{sys.version_info.major}.{sys.version_info.minor}.so.1', f'libpython{sys.version_info.major}.{sys.version_info.minor}.so']; dirs = [libdir, os.path.join(libdir, multiarch) if multiarch else '', sys.base_prefix + '/lib']; found = [os.path.join(d, n) for d in dirs if d for n in names if n and os.path.exists(os.path.join(d, n))]; print(found[0] if found else '')")
          if [ -z "$PYDLL" ]; then
            for ver in 3.12 3.13 3.11 3.10; do
              PYDLL=$(find /opt/hostedtoolcache/Python /usr/lib /usr/local/lib /lib -maxdepth 4 -name "libpython${ver}.so*" 2>/dev/null | head -n 1)
              [ -n "$PYDLL" ] && break
            done
          fi
          echo "PYTHONNET_PYDLL=$PYDLL" >> "$GITHUB_ENV"
          echo "Detected PYTHONNET_PYDLL=$PYDLL"
      - name: Run unit tests
        id: unit
        run: dotnet test Old8Lang.Tests/Old8Lang.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test_results.trx"
      - name: Run syntax tests
        id: syntax
        working-directory: TestFiles
        run: bash run_syntax_tests.sh
      - name: Run interpreter tests
        id: interpreter
        working-directory: TestFiles
        run: bash run_interpreter_tests.sh
      - name: Run IL tests
        id: il
        working-directory: TestFiles
        run: bash run_compiler_tests.sh
      - name: Run VM tests
        id: vm
        working-directory: TestFiles
        run: bash run_vm_tests.sh
      - name: Write test report
        if: always()
        env:
          UNIT_RESULT: ${{ steps.unit.outcome }}
          SYNTAX_RESULT: ${{ steps.syntax.outcome }}
          INTERPRETER_RESULT: ${{ steps.interpreter.outcome }}
          IL_RESULT: ${{ steps.il.outcome }}
          VM_RESULT: ${{ steps.vm.outcome }}
        run: |
          mkdir -p Reports
          report="Reports/$(TZ=Asia/Shanghai date +'%Y-%m-%d-%H-%M')-CI测试报告.md"
          {
            echo '# Tag release CI 测试报告'
            echo
            echo "Tag: ${GITHUB_REF_NAME}"
            echo
            echo "- 单元测试: ${UNIT_RESULT:-not run}"
            echo "- 语法测试: ${SYNTAX_RESULT:-not run}"
            echo "- 解释模式: ${INTERPRETER_RESULT:-not run}"
            echo "- IL 模式: ${IL_RESULT:-not run}"
            echo "- VM 模式: ${VM_RESULT:-not run}"
            echo
            echo '单元测试详情见 TRX 文件，各模式测试文件的运行结果见 Actions 日志。'
          } > "$report"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            Old8Lang.Tests/TestResults/**/*.trx
            Reports/*-CI测试报告.md

  package:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [linux-x64, win-x64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish executable
        run: dotnet publish Old8Lang.App/Old8Lang.App.csproj --configuration Release --runtime ${{ matrix.runtime }} --self-contained true --output dist/${{ matrix.runtime }}
      - name: Create package
        run: tar -czf old8lang-${{ matrix.runtime }}.tar.gz -C dist/${{ matrix.runtime }} .
      - uses: actions/upload-artifact@v4
        with:
          name: old8lang-${{ matrix.runtime }}
          path: old8lang-${{ matrix.runtime }}.tar.gz
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: old8lang-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz --clobber
          else
            gh release create "$TAG" dist/*.tar.gz --title "Old8Lang $TAG" --generate-notes --verify-tag
          fi
